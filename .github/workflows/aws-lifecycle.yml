name: AWS plan
on:
  workflow_dispatch:
    inputs:
      expires_at:
        description: "UTC ISO-8601 cleanup deadline for the future showcase deployment"
        required: true
        type: string

concurrency:
  group: aws-showcase
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: aws-showcase
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: true
      TF_VAR_owner: ${{ github.repository_owner }}
      TF_VAR_expires_at: ${{ inputs.expires_at }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: opspilot-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform -chdir=infra/terraform init
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform plan -lock=false
