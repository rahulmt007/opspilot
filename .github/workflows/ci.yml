name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: docker build -t opspilot:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opspilot:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: trivy.sarif}
      - uses: bridgecrewio/checkov-action@v12
        with: {directory: infra/terraform, framework: terraform, quiet: true}
  kubernetes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - run: docker build -t opspilot:local .
      - run: kind load docker-image opspilot:local
      - run: kubectl apply -f deploy/k8s
      - run: kubectl rollout status deployment/opspilot -n opspilot --timeout=120s
