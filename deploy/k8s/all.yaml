apiVersion: v1
kind: Namespace
metadata:
  name: opspilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
  namespace: opspilot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: opspilot}
  template:
    metadata:
      labels: {app: opspilot}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: opspilot:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot
  namespace: opspilot
spec:
  selector: {app: opspilot}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opspilot
  namespace: opspilot
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: opspilot}
