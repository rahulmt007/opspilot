[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot-devops-agent"
version = "0.1.0"
description = "Cost-guarded AWS DevOps agent showcase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agent = ["openai>=1.66,<2"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
opspilot = "devops_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
